# Local environment: Camunda 8.8 (Zeebe, Operate, Tasklist), Elasticsearch, PostgreSQL, Kafka
# and the order-to-cash service.
#
#   docker compose up -d --build
#
# Operate and Tasklist: http://localhost:8088 (demo / demo)
# Order API:           http://localhost:8081/api/orders
#
# For local development only; not a production setup.
name: order-to-cash

services:
  orchestration:
    image: camunda/camunda:8.8.40
    ports:
      - "26500:26500"   # gRPC gateway
      - "8088:8080"     # REST API, Operate, Tasklist
      - "9600:9600"     # management
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      retries: 40
      start_period: 30s
    volumes:
      - camunda-data:/usr/local/camunda/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cat/health | grep -qE 'green|yellow'"]
      interval: 5s
      retries: 40
      start_period: 20s
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"   # for the app and tools running on the host
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"   # any base64 UUID
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30
      start_period: 15s

  app:
    build: .
    image: ghcr.io/ahadporkar/bpmn-order-workflow:local
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      CAMUNDA_CLIENT_GRPCADDRESS: http://orchestration:26500
      CAMUNDA_CLIENT_RESTADDRESS: http://orchestration:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      orchestration:
        condition: service_healthy

volumes:
  camunda-data:
  elastic-data:
  postgres-data:

configs:
  # Same settings as Camunda's official lightweight docker-compose for 8.8 (camunda-distributions)
  orchestration-config:
    content: |
      camunda:
        system:
          cpu-thread-count: "3"
          io-thread-count: "3"
        security:
          authentication:
            method: "basic"
            unprotectedApi: true
          authorizations:
            enabled: false
          initialization:
            users:
              - username: "demo"
                password: "demo"
                name: "Demo User"
                email: "demo@example.com"
            defaultRoles.admin.users:
              - "demo"
        database.index.numberOfReplicas: 0
        data:
          secondary-storage:
            type: elasticsearch
            elasticsearch:
              cluster-name: elasticsearch
              url: "http://elasticsearch:9200"
